name: Bot Saham Harian

on:
  schedule:
    - cron: '27 3 * * 1-5'  # 10.27 WIB (Sesi Intraday Siang)
    - cron: '57 5 * * 1-5'  # 12.57 WIB (Sesi Intraday Siang)
    - cron: '57 7 * * 1-5'  # 14.57 WIB (Sesi Intraday Siang)
    - cron: '47 9 * * 1-5'  # 16.47 WIB (Sesi Final Penutupan)
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  eksekusi-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Tarik Kode dari Repositori
        uses: actions/checkout@v4
        
      - name: Siapkan Mesin Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instal Pustaka yang Dibutuhkan
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests
          
      - name: Jalankan Bot Saham
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_sahamcloud.py
        
      - name: Simpan Perubahan File CSV
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: Riwayat Sinyal & Rekap Bulanan"
          file_pattern: "*.csv"
