name: Bot Saham Otomatis

on:
  schedule:
    # 17:15 WIB sama dengan pukul 10:15 UTC. Berjalan Senin - Jumat
    - cron: '15 10 * * 1-5'
  workflow_dispatch: 

# WAJIB: Memberikan izin bot untuk menulis dan menyimpan file jurnal
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Tarik Kode dari Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Pustaka yang Dibutuhkan
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy requests

    - name: Jalankan Bot Saham
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python bot_sahamcloud.py
      
    - name: Simpan Perubahan Jurnal Trading ke GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add riwayat_sinyal.csv rekap_bulanan.csv || true
        git commit -m "Auto-update: Pembaruan jurnal TP/SL dan rekapitulasi" || echo "Tidak ada perubahan jurnal untuk disimpan"
        git push
