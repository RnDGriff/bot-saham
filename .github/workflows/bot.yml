name: Bot Saham Otomatis

on:
  schedule:
    - cron: '27 3 * * 1-5'  # 10.27 WIB (Sesi Intraday Siang)
    - cron: '57 5 * * 1-5'  # 12.57 WIB (Sesi Intraday Siang)
    - cron: '57 7 * * 1-5'  # 14.57 WIB (Sesi Intraday Siang)
    - cron: '47 9 * * 1-5'  # 16.47 WIB (Sesi Final Penutupan)
  workflow_dispatch: 
  push: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy requests

    - name: Jalankan Bot Saham
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python bot_sahamcloud.py

    - name: Commit and push file riwayat
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add riwayat_sinyal.csv rekap_bulanan.csv || true
        git commit -m "Update riwayat sinyal" || true
        git push || true
